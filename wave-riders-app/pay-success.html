<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>결제 확인 | 목포해양대학교 윈드서핑 동아리</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="more.html" data-title="결제 확인">

<div class="container">
  <section class="card">
    <h1 id="title">결제 확인 중...</h1>
    <p id="detail" class="muted">잠시만 기다려주세요. 이 창을 닫지 마세요.</p>
    <a href="index.html" class="row"><span>홈으로</span><span class="muted">›</span></a>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/nav.js"></script>
<script>
  (async function () {
    const p = new URLSearchParams(location.search);
    const body = {
      paymentKey: p.get('paymentKey'),
      orderId: p.get('orderId'),
      amount: Number(p.get('amount')),
    };
    const titleEl = document.getElementById('title');
    const detailEl = document.getElementById('detail');

    // 승인 요청은 시크릿 키가 필요하므로 서버(Supabase Edge Function)에서 처리합니다.
    const { data, error } = await supabaseClient.functions.invoke('toss-confirm', { body });

    if (error || !data || !data.ok) {
      let reason = data && data.message;
      if (!reason && error && error.context) {
        try { reason = (await error.context.json()).message; } catch (_) {}
      }
      titleEl.textContent = '결제 승인 실패 😢';
      detailEl.textContent = (reason || '알 수 없는 오류') + ' — 결제가 완료되지 않았습니다. 운영진에게 문의해주세요.';
      return;
    }

    titleEl.textContent = '회비 납부 완료 🎉';
    detailEl.textContent = `${data.amount.toLocaleString()}원 결제가 완료되었습니다. (주문번호 ${data.orderId})`;
  })();
</script>
</body>
</html>
